<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MWC 治療服務日曆</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      padding-left: var(--sal);
      padding-right: var(--sar);
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @media screen and (max-width: 768px) {
      input, select, textarea { font-size: 16px !important; }
    }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 no-print transition-all">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-2">
      <!-- 標題與雲端狀態 -->
      <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
        <div id="syncStatusIcon" class="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow-sm flex-shrink-0 transition-colors">
          <i class="fa-solid fa-cloud text-xs" id="syncCloudIcon"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center space-x-1.5 sm:space-x-2">
            <h1 class="font-bold text-slate-900 text-xs sm:text-base tracking-tight truncate">MWC 治療服務日曆</h1>
            <button id="btnCloudStatus" class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200">
              <span id="cloudStatusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1 animate-pulse"></span>
              <span id="cloudStatusText">多方即時連線中</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 功能操作區 -->
      <div class="flex items-center space-x-1.5 sm:space-x-2 flex-shrink-0">
        <button id="btnSwitchOperator" class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 text-xs font-medium">
          <i class="fa-solid fa-id-badge text-slate-500 text-xs"></i>
          <span class="hidden md:inline text-slate-500">修改人:</span>
          <span id="currentOperatorLabel" class="font-bold text-slate-900 truncate">Jo Jo</span>
          <i class="fa-solid fa-lock text-[9px] text-slate-400 ml-0.5"></i>
        </button>

        <div class="hidden lg:flex items-center space-x-1.5">
          <button id="btnOpenClientAudit" class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg border border-sky-200 bg-sky-50 hover:bg-sky-100 text-sky-800 text-xs font-medium transition shadow-2xs">
            <i class="fa-solid fa-user-check text-sky-600"></i>
            <span>個案節數核對</span>
          </button>

          <button id="btnOpenRecurModal" class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg border border-indigo-200 bg-indigo-50 hover:bg-indigo-100 text-indigo-800 text-xs font-medium transition shadow-2xs">
            <i class="fa-solid fa-repeat text-indigo-600"></i>
            <span>連續服務</span>
          </button>

          <button id="btnOpenStatsModal" class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg border border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-900 text-xs font-medium transition shadow-2xs">
            <i class="fa-solid fa-chart-pie text-amber-600"></i>
            <span>職員統計中心</span>
          </button>

          <button id="btnOpenTeamsConfig" class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg border border-purple-200 bg-purple-50 hover:bg-purple-100 text-purple-800 text-xs font-medium transition shadow-2xs">
            <i class="fa-brands fa-microsoft text-purple-600"></i>
            <span>Teams 通知</span>
          </button>

          <button id="btnOpenAuditModal" class="inline-flex items-center space-x-1 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-medium transition shadow-2xs">
            <i class="fa-solid fa-clock-rotate-left text-slate-600"></i>
            <span>修改報告</span>
            <span id="auditCountBadge" class="ml-1 px-1.5 py-0.2 bg-slate-800 text-white text-[10px] rounded-full font-mono font-bold">0</span>
          </button>
        </div>

        <button id="btnOpenNewModal" class="inline-flex items-center space-x-1 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition shadow-sm">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>預約</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 md:p-6 space-y-3 sm:space-y-4">
    <!-- 控制列 -->
    <div class="bg-white rounded-xl border border-slate-200/80 p-2.5 sm:p-3 shadow-2xs space-y-2.5 sm:space-y-3">
      <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-2.5 sm:gap-3">
        <div class="flex flex-wrap items-center justify-between sm:justify-start gap-1.5 sm:gap-2">
          <div class="inline-flex rounded-lg border border-slate-200 bg-slate-50/80 p-0.5">
            <button id="btnPrevYear" class="px-2 py-1 text-slate-600 hover:text-slate-900 hover:bg-white rounded text-xs transition"><i class="fa-solid fa-angles-left"></i></button>
            <button id="btnPrevMonth" class="px-2.5 py-1 text-slate-600 hover:text-slate-900 hover:bg-white rounded text-xs transition"><i class="fa-solid fa-chevron-left"></i></button>
            <button id="btnNextMonth" class="px-2.5 py-1 text-slate-600 hover:text-slate-900 hover:bg-white rounded text-xs transition"><i class="fa-solid fa-chevron-right"></i></button>
            <button id="btnNextYear" class="px-2 py-1 text-slate-600 hover:text-slate-900 hover:bg-white rounded text-xs transition"><i class="fa-solid fa-angles-right"></i></button>
          </div>

          <div class="flex items-center space-x-1">
            <select id="jumpYearSelect" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs font-semibold text-slate-800"></select>
            <select id="jumpMonthSelect" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs font-semibold text-slate-800">
              <option value="0">1月</option><option value="1">2月</option><option value="2">3月</option>
              <option value="3">4月</option><option value="4">5月</option><option value="5">6月</option>
              <option value="6">7月</option><option value="7">8月</option><option value="8">9月</option>
              <option value="9">10月</option><option value="10">11月</option><option value="11">12月</option>
            </select>
          </div>

          <button id="btnToday" class="px-2.5 py-1 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-medium">返回今天</button>
          <div id="currentViewLabel" class="text-sm sm:text-base font-bold text-slate-900 px-1 truncate">2027年 1月</div>
        </div>

        <div class="inline-flex rounded-lg border border-slate-200 bg-slate-100/70 p-0.5 text-xs font-medium">
          <button id="viewBtnMonth" class="px-3 py-1 rounded-md text-slate-900 bg-white shadow-2xs font-bold transition">月曆</button>
          <button id="viewBtnWeek" class="px-3 py-1 rounded-md text-slate-600 hover:text-slate-900 transition">週時段</button>
          <button id="viewBtnTable" class="px-3 py-1 rounded-md text-slate-600 hover:text-slate-900 transition">清單總表</button>
          <button id="viewBtnYear" class="px-3 py-1 rounded-md text-slate-600 hover:text-slate-900 transition">年度矩陣</button>
        </div>
      </div>

      <!-- 篩選列：已加上亮眼顏色與色標圓點 -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 text-xs">
        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
          <div class="inline-flex rounded-xl border border-slate-200 bg-slate-100/80 p-1 gap-1" id="disciplineFilterGroup">
            <!-- 全部部別 -->
            <button class="filter-discipline px-3 py-1 rounded-lg bg-slate-900 text-white font-bold shadow-xs transition inline-flex items-center space-x-1.5" data-discipline="all">
              <span class="w-2 h-2 rounded-full bg-white"></span>
              <span>全部部別</span>
            </button>
            <!-- 物理 PT (黃色) -->
            <button class="filter-discipline px-3 py-1 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-950 border border-amber-300 font-semibold transition inline-flex items-center space-x-1.5" data-discipline="PT">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span>
              <span>物理 PT</span>
            </button>
            <!-- 職業 OT (綠色) -->
            <button class="filter-discipline px-3 py-1 rounded-lg bg-emerald-100 hover:bg-emerald-200 text-emerald-950 border border-emerald-300 font-semibold transition inline-flex items-center space-x-1.5" data-discipline="OT">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span>職業 OT</span>
            </button>
            <!-- 言語 ST (紫色) -->
            <button class="filter-discipline px-3 py-1 rounded-lg bg-purple-100 hover:bg-purple-200 text-purple-950 border border-purple-300 font-semibold transition inline-flex items-center space-x-1.5" data-discipline="ST">
              <span class="w-2 h-2 rounded-full bg-purple-500"></span>
              <span>言語 ST</span>
            </button>
          </div>

          <select id="filterStaffSelect" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-slate-700 font-medium">
            <option value="all">全體負責職員</option>
            <option value="PTA 珊">PTA 珊</option>
            <option value="PTA B哥">PTA B哥</option>
            <option value="PT Sing">PT Sing</option>
            <option value="ST Tammy">ST Tammy</option>
            <option value="ST Kelvin">ST Kelvin</option>
            <option value="OTA Rebecca">OTA Rebecca</option>
            <option value="OT Ken">OT Ken</option>
          </select>

          <select id="filterStatusSelect" class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-slate-700 font-medium">
            <option value="all">所有狀態</option>
            <option value="active">正常出席</option>
            <option value="cancelled">已取消/請假</option>
          </select>
        </div>

        <div class="relative w-full sm:w-56">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" placeholder="搜尋個案姓名、節數..." class="w-full pl-7 pr-3 py-1 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:bg-white focus:ring-1 focus:ring-slate-400">
        </div>
      </div>
    </div>

    <!-- 月曆檢視 -->
    <div id="viewContainerMonth" class="space-y-3">
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-2xs">
        <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50/80 text-center text-xs font-bold text-slate-600 py-2">
          <div class="text-rose-500">週日</div>
          <div>週一</div>
          <div>週二</div>
          <div>週三</div>
          <div>週四</div>
          <div>週五</div>
          <div class="text-sky-600">週六</div>
        </div>
        <div id="monthGrid" class="grid grid-cols-7 divide-x divide-y divide-slate-100 text-xs bg-slate-100 min-h-[500px]"></div>
      </div>
    </div>

    <!-- 週時段檢視 -->
    <div id="viewContainerWeek" class="hidden bg-white rounded-xl border border-slate-200 overflow-hidden shadow-2xs p-3">
      <div class="overflow-x-auto no-scrollbar">
        <table class="w-full text-xs border-collapse">
          <thead><tr id="weekHeaderRow" class="border-b border-slate-200 bg-slate-50 text-slate-700"><th class="p-2 border-r border-slate-200 w-20 text-center sticky left-0 bg-slate-50 z-10">時段</th></tr></thead>
          <tbody id="weekTimeTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>

    <!-- 清單總表 -->
    <div id="viewContainerTable" class="hidden bg-white rounded-xl border border-slate-200 overflow-hidden shadow-2xs">
      <div class="p-3 border-b border-slate-200 bg-slate-50 flex items-center justify-between text-xs">
        <div class="font-bold text-slate-800">總登記排班表 (Excel 風格清單)</div>
        <button id="btnExportCSV" class="px-2.5 py-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700">匯出 CSV</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left divide-y divide-slate-200">
          <thead class="bg-slate-50 text-slate-600 uppercase font-semibold">
            <tr>
              <th class="px-3 py-2">日期</th>
              <th class="px-3 py-2">時間</th>
              <th class="px-3 py-2">個案姓名</th>
              <th class="px-3 py-2">專職部別</th>
              <th class="px-3 py-2">服務類別</th>
              <th class="px-3 py-2">節數進度</th>
              <th class="px-3 py-2">負責職員</th>
              <th class="px-3 py-2">狀態</th>
              <th class="px-3 py-2 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="scheduleTableBody" class="divide-y divide-slate-100 text-slate-800"></tbody>
        </table>
      </div>
    </div>

    <!-- 年度矩陣檢視 -->
    <div id="viewContainerYear" class="hidden space-y-3">
      <div class="bg-white rounded-xl border border-slate-200 p-3 shadow-2xs font-bold text-slate-800 text-sm" id="yearMatrixTitle">年度矩陣總覽</div>
      <div id="yearMatrixGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
    </div>
  </main>

  <!-- MODAL: 編輯 / 新增預約 -->
  <div id="appointmentModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs hidden p-3">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200">
      <div class="px-4 py-3 bg-slate-900 text-white flex items-center justify-between">
        <h3 id="modalTitle" class="text-sm font-bold">預約管理</h3>
        <button id="btnCloseModal" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="appointmentForm" class="p-4 space-y-3 max-h-[85vh] overflow-y-auto text-xs">
        <input type="hidden" id="formEventId">
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block font-semibold mb-1">個案姓名 *</label><input type="text" id="formClientName" required class="w-full px-2.5 py-1.5 border rounded-lg"></div>
          <div><label class="block font-semibold mb-1">治療日期 *</label><input type="date" id="formDate" required class="w-full px-2.5 py-1.5 border rounded-lg"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block font-semibold mb-1">專職部別</label><select id="formDiscipline" class="w-full px-2.5 py-1.5 border rounded-lg"><option value="PT">物理 PT (黃色)</option><option value="OT">職業 OT (綠色)</option><option value="ST">言語 ST (紫色)</option></select></div>
          <div><label class="block font-semibold mb-1">服務類別</label><input type="text" id="formService" value="PTA (8 Sessions)" class="w-full px-2.5 py-1.5 border rounded-lg"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block font-semibold mb-1">負責職員</label><select id="formStaff" class="w-full px-2.5 py-1.5 border rounded-lg"><option value="PTA 珊">PTA 珊</option><option value="PTA B哥">PTA B哥</option><option value="PT Sing">PT Sing</option><option value="ST Tammy">ST Tammy</option><option value="ST Kelvin">ST Kelvin</option><option value="OTA Rebecca">OTA Rebecca</option><option value="OT Ken">OT Ken</option></select></div>
          <div><label class="block font-semibold mb-1">節數進度</label><input type="text" id="formSection" placeholder="Section 1" class="w-full px-2.5 py-1.5 border rounded-lg"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block font-semibold mb-1">開始時間</label><input type="time" id="formStartTime" value="09:30" class="w-full px-2.5 py-1.5 border rounded-lg"></div>
          <div><label class="block font-semibold mb-1">結束時間</label><input type="time" id="formEndTime" value="10:30" class="w-full px-2.5 py-1.5 border rounded-lg"></div>
        </div>
        <div class="pt-2 border-t flex items-center justify-between">
          <button type="button" id="btnDeleteEvent" class="px-2.5 py-1 bg-rose-50 text-rose-700 border border-rose-200 rounded hidden">刪除</button>
          <div class="space-x-2 ml-auto">
            <button type="button" id="btnCancelModal" class="px-3 py-1.5 border rounded-lg text-slate-600">取消</button>
            <button type="submit" class="px-4 py-1.5 bg-slate-900 text-white rounded-lg">儲存預約</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: 連續服務精靈 -->
  <div id="recurModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs hidden p-3">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-4 space-y-3 text-xs">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-sm text-indigo-900">連續服務排班精靈</h3>
        <button id="btnCloseRecurModal" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="recurForm" class="space-y-3">
        <div><label class="block font-semibold mb-1">個案姓名</label><input type="text" id="recurClientName" required class="w-full px-2.5 py-1.5 border rounded-lg"></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block font-semibold mb-1">專職部別</label><select id="recurDiscipline" class="w-full px-2.5 py-1.5 border rounded-lg"><option value="PT">物理 PT (黃色)</option><option value="OT">職業 OT (綠色)</option><option value="ST">言語 ST (紫色)</option></select></div>
          <div><label class="block font-semibold mb-1">總排定節數</label><input type="number" id="recurTotalSessions" value="8" min="1" max="30" class="w-full px-2.5 py-1.5 border rounded-lg"></div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block font-semibold mb-1">負責職員</label><select id="recurStaff" class="w-full px-2.5 py-1.5 border rounded-lg"><option value="PTA 珊">PTA 珊</option><option value="PTA B哥">PTA B哥</option><option value="PT Sing">PT Sing</option><option value="ST Tammy">ST Tammy</option><option value="ST Kelvin">ST Kelvin</option><option value="OTA Rebecca">OTA Rebecca</option><option value="OT Ken">OT Ken</option></select></div>
          <div><label class="block font-semibold mb-1">起始日期</label><input type="date" id="recurStartDate" required class="w-full px-2.5 py-1.5 border rounded-lg"></div>
        </div>
        <div class="flex justify-end space-x-2 pt-2 border-t">
          <button type="button" id="btnCancelRecur" class="px-3 py-1.5 border rounded-lg">關閉</button>
          <button type="submit" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg">產生排班</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: 職員業務統計中心 -->
  <div id="statsModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs hidden p-3">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full p-4 space-y-3 text-xs max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-sm text-amber-900">職員業務統計中心</h3>
        <button id="btnCloseStatsModal" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-2 rounded-lg">
        <div class="inline-flex rounded-lg border bg-white p-0.5" id="statsTabs">
          <button id="tabBtnClients" class="px-3 py-1 bg-amber-500 text-white rounded font-bold">1: 個案人次</button>
          <button id="tabBtnSessions" class="px-3 py-1 text-slate-600 rounded font-medium">2: 總節數</button>
          <button id="tabBtnRevenue" class="px-3 py-1 text-slate-600 rounded font-medium">3: 總收入</button>
        </div>
        <button id="btnExportStatsExcel" class="px-3 py-1 bg-emerald-600 text-white rounded font-semibold"><i class="fa-solid fa-file-excel mr-1"></i>匯出 Excel</button>
      </div>
      <div class="flex-1 overflow-y-auto" id="statsContentArea">
        <table class="w-full border-collapse text-left divide-y divide-slate-200">
          <thead class="bg-slate-100 font-bold text-slate-700" id="statsThead"></thead>
          <tbody id="statsTbody" class="divide-y divide-slate-100 text-slate-800"></tbody>
        </table>
      </div>
      <div class="flex justify-end pt-2 border-t">
        <button id="btnCloseStatsFooter" class="px-4 py-1.5 bg-slate-800 text-white rounded-lg">關閉</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-24 opacity-0 transition-all duration-300 px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center space-x-2 text-white bg-slate-900 shadow-xl">
    <span id="toastMsg">通知訊息</span>
  </div>

  <!-- 應用程式邏輯與即時同步模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    // 內建預設排班資料
    const DEFAULT_SCHEDULE = [
      { id: "mwc-001", date: "2026-10-02", startTime: "09:30", endTime: "10:30", client: "何愛蘭", service: "PT+PTA", discipline: "PT", staff: "PTA 珊", section: "Section 9 Cancel", status: "cancelled" },
      { id: "mwc-002", date: "2026-10-09", startTime: "09:30", endTime: "10:30", client: "何愛蘭", service: "PTA", discipline: "PT", staff: "PTA 珊", section: "Section 9", status: "active" },
      { id: "mwc-011", date: "2026-10-02", startTime: "09:30", endTime: "10:15", client: "全興棠", service: "OTA", discipline: "OT", staff: "OTA Rebecca", section: "Section 9", status: "active" },
      { id: "mwc-012", date: "2026-10-02", startTime: "13:30", endTime: "14:15", client: "羅屏蘇", service: "ST", discipline: "ST", staff: "ST Kelvin", section: "Section 9", status: "active" },
      { id: "mwc-096", date: "2026-10-08", startTime: "09:45", endTime: "10:45", client: "張明清", service: "PT+PTA", discipline: "PT", staff: "PTA 珊", section: "Section 1", status: "active" },
      { id: "mwc-105", date: "2027-01-02", startTime: "09:30", endTime: "10:30", client: "Allen", service: "PTA", discipline: "PT", staff: "PTA 珊", section: "Section 1", status: "active" },
      { id: "mwc-106", date: "2027-01-02", startTime: "09:30", endTime: "10:30", client: "Allen", service: "PTA", discipline: "PT", staff: "PTA 珊", section: "Section 1 Cancel", status: "cancelled" },
      { id: "mwc-107", date: "2027-01-05", startTime: "09:30", endTime: "10:30", client: "何愛蘭", service: "PTA", discipline: "PT", staff: "PTA 珊", section: "Section 2", status: "active" },
      { id: "mwc-108", date: "2027-01-06", startTime: "14:00", endTime: "15:00", client: "羅漢星", service: "PTA", discipline: "PT", staff: "PTA B哥", section: "Section 1", status: "active" },
      { id: "mwc-109", date: "2027-01-07", startTime: "10:00", endTime: "11:00", client: "張明清", service: "PTA", discipline: "PT", staff: "PTA 珊", section: "Section 1", status: "active" }
    ];

    const state = {
      currentDate: new Date(2027, 0, 7),
      selectedDayDate: new Date(2027, 0, 7),
      currentView: 'month',
      currentRole: 'Jo Jo',
      filterDiscipline: 'all',
      filterStaff: 'all',
      filterStatus: 'all',
      searchQuery: '',
      appointments: [],
      currentStatsTab: 'clients',
      isOnline: false
    };

    function initData() {
      try {
        const raw = localStorage.getItem('mwc_appointments_data');
        if (raw) {
          const parsed = JSON.parse(raw);
          state.appointments = (Array.isArray(parsed) && parsed.length > 0) ? parsed : DEFAULT_SCHEDULE;
        } else {
          state.appointments = DEFAULT_SCHEDULE;
          localStorage.setItem('mwc_appointments_data', JSON.stringify(state.appointments));
        }
      } catch (e) {
        state.appointments = DEFAULT_SCHEDULE;
      }
    }

    function saveLocal() {
      try {
        localStorage.setItem('mwc_appointments_data', JSON.stringify(state.appointments));
      } catch (e) {
        console.warn('本機儲存失敗', e);
      }
    }

    // 配色：PT:黃色, OT:綠色, ST:紫色
    function getDisciplineClass(d) {
      if (d === 'PT') return 'bg-amber-100 text-amber-900 border-amber-300';
      if (d === 'OT') return 'bg-emerald-100 text-emerald-900 border-emerald-300';
      if (d === 'ST') return 'bg-purple-100 text-purple-900 border-purple-300';
      return 'bg-slate-100 text-slate-800 border-slate-300';
    }

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function setSyncStatus(online, text) {
      state.isOnline = online;
      const statusIcon = document.getElementById('syncStatusIcon');
      const statusDot = document.getElementById('cloudStatusDot');
      const statusText = document.getElementById('cloudStatusText');
      const btn = document.getElementById('btnCloudStatus');

      if (online) {
        statusIcon.className = 'w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow-sm flex-shrink-0 transition-colors';
        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1 animate-pulse';
        btn.className = 'inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 transition-colors';
        statusText.textContent = text || '多方即時連線中';
      } else {
        statusIcon.className = 'w-8 h-8 rounded-lg bg-amber-500 text-white flex items-center justify-center font-bold text-sm shadow-sm flex-shrink-0 transition-colors';
        statusDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500 mr-1';
        btn.className = 'inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-50 text-amber-800 border border-amber-200 transition-colors';
        statusText.textContent = text || '本機安全模式 (離線運作)';
      }
    }

    function renderCurrentView() {
      const y = state.currentDate.getFullYear();
      const m = state.currentDate.getMonth();
      document.getElementById('currentViewLabel').textContent = `${y}年 ${m + 1}月`;
      document.getElementById('jumpYearSelect').value = y;
      document.getElementById('jumpMonthSelect').value = m;

      if (state.currentView === 'month') renderMonthView();
      else if (state.currentView === 'week') renderWeekView();
      else if (state.currentView === 'table') renderTableView();
      else if (state.currentView === 'year') renderYearView();
    }

    function getFilteredList() {
      return state.appointments.filter(a => {
        if (state.filterDiscipline !== 'all' && a.discipline !== state.filterDiscipline) return false;
        if (state.filterStaff !== 'all' && a.staff !== state.filterStaff) return false;
        if (state.filterStatus === 'active' && a.status === 'cancelled') return false;
        if (state.filterStatus === 'cancelled' && a.status !== 'cancelled') return false;
        if (state.searchQuery) {
          const q = state.searchQuery.toLowerCase();
          return (a.client || '').toLowerCase().includes(q) || (a.section || '').toLowerCase().includes(q);
        }
        return true;
      });
    }

    function renderMonthView() {
      const grid = document.getElementById('monthGrid');
      grid.innerHTML = '';

      const y = state.currentDate.getFullYear();
      const m = state.currentDate.getMonth();
      const firstDay = new Date(y, m, 1).getDay();
      const totalDays = new Date(y, m + 1, 0).getDate();
      const prevTotal = new Date(y, m, 0).getDate();
      const filtered = getFilteredList();

      for (let i = firstDay - 1; i >= 0; i--) {
        const cell = document.createElement('div');
        cell.className = 'min-h-[110px] p-1.5 bg-slate-50 text-slate-300 text-xs font-bold';
        cell.textContent = prevTotal - i;
        grid.appendChild(cell);
      }

      for (let d = 1; d <= totalDays; d++) {
        const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayEvents = filtered.filter(a => a.date === dateStr);
        dayEvents.sort((a,b) => a.startTime.localeCompare(b.startTime));

        const cell = document.createElement('div');
        cell.className = 'min-h-[110px] p-1.5 bg-white border-t border-slate-100 flex flex-col justify-between hover:bg-slate-50 cursor-pointer';

        const head = document.createElement('div');
        head.className = 'font-bold text-xs text-slate-800';
        head.textContent = d;
        cell.appendChild(head);

        const listDiv = document.createElement('div');
        listDiv.className = 'space-y-1 flex-1 mt-1 overflow-hidden';

        dayEvents.forEach(ev => {
          const badge = document.createElement('div');
          const isCancel = ev.status === 'cancelled';
          const disClass = getDisciplineClass(ev.discipline);
          let sec = (ev.section || '').replace(/Section\s*/i, 'S');

          badge.className = `p-1 rounded border text-[10px] truncate leading-tight ${disClass} ${isCancel ? 'opacity-50 line-through' : ''}`;
          badge.innerHTML = `<span class="font-bold">${ev.startTime}</span> ${ev.client} (${ev.staff.split(' ')[0]}) <span class="bg-white/70 px-0.5 rounded text-[9px]">${sec}</span>`;
          badge.onclick = (e) => {
            e.stopPropagation();
            openEditModal(ev);
          };
          listDiv.appendChild(badge);
        });

        cell.appendChild(listDiv);
        cell.onclick = () => {
          openNewModal(dateStr);
        };
        grid.appendChild(cell);
      }
    }

    function renderWeekView() {
      const header = document.getElementById('weekHeaderRow');
      const tbody = document.getElementById('weekTimeTableBody');
      header.innerHTML = '<th class="p-2 border-r w-20 text-center">時段</th>';
      tbody.innerHTML = '';

      const curr = new Date(state.currentDate);
      const start = new Date(curr.setDate(curr.getDate() - curr.getDay()));
      const days = [];

      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        days.push(d);
        const th = document.createElement('th');
        th.className = 'p-2 text-center border-r font-semibold';
        th.innerHTML = `<div>週${['日','一','二','三','四','五','六'][i]}</div><div class="text-[10px] text-slate-400">${d.getMonth()+1}/${d.getDate()}</div>`;
        header.appendChild(th);
      }

      ['09:00','10:00','11:00','12:00','14:00','15:00','16:00'].forEach(hr => {
        const tr = document.createElement('tr');
        tr.className = 'border-b';
        tr.innerHTML = `<td class="p-2 border-r font-mono text-center font-bold text-slate-500">${hr}</td>`;
        days.forEach(d => {
          const dStr = formatDate(d);
          const td = document.createElement('td');
          td.className = 'p-1 border-r min-w-[100px] align-top';
          const evs = getFilteredList().filter(a => a.date === dStr && a.startTime.startsWith(hr.split(':')[0]));
          evs.forEach(ev => {
            const card = document.createElement('div');
            card.className = `p-1 mb-1 rounded border text-[10px] cursor-pointer ${getDisciplineClass(ev.discipline)}`;
            card.textContent = `${ev.client} (${ev.section})`;
            card.onclick = () => openEditModal(ev);
            td.appendChild(card);
          });
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function renderTableView() {
      const tbody = document.getElementById('scheduleTableBody');
      tbody.innerHTML = '';
      getFilteredList().forEach(ev => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50';
        tr.innerHTML = `
          <td class="px-3 py-2 font-mono">${ev.date}</td>
          <td class="px-3 py-2 font-mono font-bold">${ev.startTime}-${ev.endTime}</td>
          <td class="px-3 py-2 font-bold">${ev.client}</td>
          <td class="px-3 py-2"><span class="px-2 py-0.5 rounded text-[10px] font-bold border ${getDisciplineClass(ev.discipline)}">${ev.discipline}</span></td>
          <td class="px-3 py-2">${ev.service}</td>
          <td class="px-3 py-2">${ev.section}</td>
          <td class="px-3 py-2">${ev.staff}</td>
          <td class="px-3 py-2 font-semibold ${ev.status==='cancelled'?'text-rose-600':'text-emerald-600'}">${ev.status==='cancelled'?'已取消':'正常'}</td>
          <td class="px-3 py-2 text-right"><button class="px-2 py-0.5 bg-slate-100 rounded">編輯</button></td>
        `;
        tr.querySelector('button').onclick = () => openEditModal(ev);
        tbody.appendChild(tr);
      });
    }

    function renderYearView() {
      const grid = document.getElementById('yearMatrixGrid');
      grid.innerHTML = '';
      const y = state.currentDate.getFullYear();
      for (let m = 0; m < 12; m++) {
        const count = state.appointments.filter(a => {
          const d = new Date(a.date);
          return d.getFullYear() === y && d.getMonth() === m;
        }).length;
        const card = document.createElement('div');
        card.className = 'p-3 bg-slate-50 border rounded-xl hover:border-slate-400 cursor-pointer';
        card.innerHTML = `<div class="font-bold flex justify-between"><span>${y}年 ${m+1}月</span><span class="text-xs bg-slate-800 text-white px-2 py-0.5 rounded-full">${count} 節</span></div>`;
        card.onclick = () => {
          state.currentDate = new Date(y, m, 1);
          switchView('month');
        };
        grid.appendChild(card);
      }
    }

    function switchView(v) {
      state.currentView = v;
      ['Month','Week','Table','Year'].forEach(name => {
        document.getElementById(`viewContainer${name}`).classList.toggle('hidden', name.toLowerCase() !== v);
        document.getElementById(`viewBtn${name}`).className = (name.toLowerCase() === v)
          ? 'px-3 py-1 rounded-md text-slate-900 bg-white shadow-2xs font-bold transition'
          : 'px-3 py-1 rounded-md text-slate-600 hover:text-slate-900 transition';
      });
      renderCurrentView();
    }

    function openEditModal(ev) {
      document.getElementById('formEventId').value = ev.id;
      document.getElementById('formClientName').value = ev.client;
      document.getElementById('formDate').value = ev.date;
      document.getElementById('formDiscipline').value = ev.discipline;
      document.getElementById('formService').value = ev.service;
      document.getElementById('formStaff').value = ev.staff;
      document.getElementById('formSection').value = ev.section;
      document.getElementById('formStartTime').value = ev.startTime;
      document.getElementById('formEndTime').value = ev.endTime;
      document.getElementById('btnDeleteEvent').classList.remove('hidden');
      document.getElementById('appointmentModal').classList.remove('hidden');
    }

    function openNewModal(dateStr) {
      document.getElementById('appointmentForm').reset();
      document.getElementById('formEventId').value = '';
      document.getElementById('formDate').value = dateStr || formatDate(state.currentDate);
      document.getElementById('btnDeleteEvent').classList.add('hidden');
      document.getElementById('appointmentModal').classList.remove('hidden');
    }

    document.getElementById('appointmentForm').onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('formEventId').value;
      const data = {
        id: id || ('mwc-' + Date.now()),
        client: document.getElementById('formClientName').value,
        date: document.getElementById('formDate').value,
        discipline: document.getElementById('formDiscipline').value,
        service: document.getElementById('formService').value,
        staff: document.getElementById('formStaff').value,
        section: document.getElementById('formSection').value,
        startTime: document.getElementById('formStartTime').value,
        endTime: document.getElementById('formEndTime').value,
        status: 'active'
      };

      if (id) {
        const idx = state.appointments.findIndex(a => a.id === id);
        if (idx !== -1) state.appointments[idx] = data;
      } else {
        state.appointments.push(data);
      }

      saveLocal();
      syncFirebase();
      document.getElementById('appointmentModal').classList.add('hidden');
      renderCurrentView();
      showToast('排班預約已儲存');
    };

    document.getElementById('btnDeleteEvent').onclick = () => {
      const id = document.getElementById('formEventId').value;
      state.appointments = state.appointments.filter(a => a.id !== id);
      saveLocal();
      syncFirebase();
      document.getElementById('appointmentModal').classList.add('hidden');
      renderCurrentView();
      showToast('排班已刪除');
    };

    function renderStats(tab) {
      state.currentStatsTab = tab;
      const thead = document.getElementById('statsThead');
      const tbody = document.getElementById('statsTbody');
      tbody.innerHTML = '';

      const staffMap = {};
      state.appointments.forEach(a => {
        if (!staffMap[a.staff]) staffMap[a.staff] = { clients: new Set(), active: 0, cancel: 0, total: 0, revenue: 0 };
        const s = staffMap[a.staff];
        s.clients.add(a.client);
        s.total++;
        if (a.status === 'cancelled') s.cancel++;
        else {
          s.active++;
          const price = a.discipline === 'ST' ? 500 : (a.service && a.service.includes('PTA') ? 380 : 650);
          s.revenue += price;
        }
      });

      if (tab === 'clients') {
        thead.innerHTML = '<tr><th class="p-2">職員</th><th class="p-2 text-center">個案人次 (不重複)</th><th class="p-2">個案清單</th></tr>';
        Object.keys(staffMap).forEach(staff => {
          const s = staffMap[staff];
          const tr = document.createElement('tr');
          tr.innerHTML = `<td class="p-2 font-bold">${staff}</td><td class="p-2 text-center font-bold text-amber-700 font-mono">${s.clients.size}</td><td class="p-2 text-slate-500">${Array.from(s.clients).join('、')}</td>`;
          tbody.appendChild(tr);
        });
      } else if (tab === 'sessions') {
        thead.innerHTML = '<tr><th class="p-2">職員</th><th class="p-2 text-center text-emerald-700">出席節數</th><th class="p-2 text-center text-rose-600">取消節數</th><th class="p-2 text-center">總節數</th></tr>';
        Object.keys(staffMap).forEach(staff => {
          const s = staffMap[staff];
          const tr = document.createElement('tr');
          tr.innerHTML = `<td class="p-2 font-bold">${staff}</td><td class="p-2 text-center font-bold text-emerald-700 font-mono">${s.active}</td><td class="p-2 text-center font-bold text-rose-600 font-mono">${s.cancel}</td><td class="p-2 text-center font-bold font-mono">${s.total}</td>`;
          tbody.appendChild(tr);
        });
      } else {
        thead.innerHTML = '<tr><th class="p-2">職員</th><th class="p-2 text-center">計費節數</th><th class="p-2 text-right">預估總收入 (HKD)</th></tr>';
        Object.keys(staffMap).forEach(staff => {
          const s = staffMap[staff];
          const tr = document.createElement('tr');
          tr.innerHTML = `<td class="p-2 font-bold">${staff}</td><td class="p-2 text-center font-mono">${s.active}</td><td class="p-2 text-right font-bold text-emerald-700 font-mono">$${s.revenue.toLocaleString()}</td>`;
          tbody.appendChild(tr);
        });
      }
    }

    document.getElementById('tabBtnClients').onclick = () => renderStats('clients');
    document.getElementById('tabBtnSessions').onclick = () => renderStats('sessions');
    document.getElementById('tabBtnRevenue').onclick = () => renderStats('revenue');
    document.getElementById('btnOpenStatsModal').onclick = () => {
      renderStats('clients');
      document.getElementById('statsModal').classList.remove('hidden');
    };
    document.getElementById('btnCloseStatsModal').onclick = () => document.getElementById('statsModal').classList.add('hidden');
    document.getElementById('btnCloseStatsFooter').onclick = () => document.getElementById('statsModal').classList.add('hidden');

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.remove('translate-y-24','opacity-0');
      setTimeout(() => t.classList.add('translate-y-24','opacity-0'), 2500);
    }

    // 控制項事件綁定
    document.getElementById('viewBtnMonth').onclick = () => switchView('month');
    document.getElementById('viewBtnWeek').onclick = () => switchView('week');
    document.getElementById('viewBtnTable').onclick = () => switchView('table');
    document.getElementById('viewBtnYear').onclick = () => switchView('year');

    document.getElementById('btnPrevMonth').onclick = () => { state.currentDate.setMonth(state.currentDate.getMonth()-1); renderCurrentView(); };
    document.getElementById('btnNextMonth').onclick = () => { state.currentDate.setMonth(state.currentDate.getMonth()+1); renderCurrentView(); };
    document.getElementById('btnPrevYear').onclick = () => { state.currentDate.setFullYear(state.currentDate.getFullYear()-1); renderCurrentView(); };
    document.getElementById('btnNextYear').onclick = () => { state.currentDate.setFullYear(state.currentDate.getFullYear()+1); renderCurrentView(); };
    document.getElementById('btnToday').onclick = () => { state.currentDate = new Date(); renderCurrentView(); };

    const ySelect = document.getElementById('jumpYearSelect');
    for (let yr = 2024; yr <= 2030; yr++) {
      const opt = document.createElement('option');
      opt.value = String(yr);
      opt.textContent = `${yr}年`;
      ySelect.appendChild(opt);
    }
    ySelect.onchange = (e) => { 
      state.currentDate.setFullYear(parseInt(e.target.value, 10)); 
      renderCurrentView(); 
    };

    document.getElementById('jumpMonthSelect').onchange = (e) => { 
      state.currentDate.setMonth(parseInt(e.target.value, 10)); 
      renderCurrentView(); 
    };

    // 專屬部別彩色按鈕點擊與動態高亮邏輯
    function updateDisciplineFilterUI() {
      document.querySelectorAll('.filter-discipline').forEach(b => {
        const disc = b.dataset.discipline;
        const isSelected = (state.filterDiscipline === disc);

        if (disc === 'all') {
          b.className = isSelected
            ? 'filter-discipline px-3 py-1 rounded-lg bg-slate-900 text-white font-bold shadow-xs transition inline-flex items-center space-x-1.5'
            : 'filter-discipline px-3 py-1 rounded-lg bg-slate-200/80 hover:bg-slate-300 text-slate-700 font-medium transition inline-flex items-center space-x-1.5';
        } else if (disc === 'PT') {
          b.className = isSelected
            ? 'filter-discipline px-3 py-1 rounded-lg bg-amber-400 text-amber-950 font-bold border-2 border-amber-600 shadow-xs transition inline-flex items-center space-x-1.5'
            : 'filter-discipline px-3 py-1 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-950 border border-amber-300 font-semibold transition inline-flex items-center space-x-1.5';
        } else if (disc === 'OT') {
          b.className = isSelected
            ? 'filter-discipline px-3 py-1 rounded-lg bg-emerald-400 text-emerald-950 font-bold border-2 border-emerald-600 shadow-xs transition inline-flex items-center space-x-1.5'
            : 'filter-discipline px-3 py-1 rounded-lg bg-emerald-100 hover:bg-emerald-200 text-emerald-950 border border-emerald-300 font-semibold transition inline-flex items-center space-x-1.5';
        } else if (disc === 'ST') {
          b.className = isSelected
            ? 'filter-discipline px-3 py-1 rounded-lg bg-purple-400 text-purple-950 font-bold border-2 border-purple-600 shadow-xs transition inline-flex items-center space-x-1.5'
            : 'filter-discipline px-3 py-1 rounded-lg bg-purple-100 hover:bg-purple-200 text-purple-950 border border-purple-300 font-semibold transition inline-flex items-center space-x-1.5';
        }
      });
    }

    document.querySelectorAll('.filter-discipline').forEach(btn => {
      btn.onclick = () => {
        state.filterDiscipline = btn.dataset.discipline;
        updateDisciplineFilterUI();
        renderCurrentView();
      };
    });

    document.getElementById('filterStaffSelect').onchange = (e) => { state.filterStaff = e.target.value; renderCurrentView(); };
    document.getElementById('filterStatusSelect').onchange = (e) => { state.filterStatus = e.target.value; renderCurrentView(); };
    document.getElementById('searchInput').oninput = (e) => { state.searchQuery = e.target.value.trim(); renderCurrentView(); };

    document.getElementById('btnOpenNewModal').onclick = () => openNewModal();
    document.getElementById('btnCloseModal').onclick = () => document.getElementById('appointmentModal').classList.add('hidden');
    document.getElementById('btnCancelModal').onclick = () => document.getElementById('appointmentModal').classList.add('hidden');

    document.getElementById('btnOpenRecurModal').onclick = () => document.getElementById('recurModal').classList.remove('hidden');
    document.getElementById('btnCloseRecurModal').onclick = () => document.getElementById('recurModal').classList.add('hidden');
    document.getElementById('btnCancelRecur').onclick = () => document.getElementById('recurModal').classList.add('hidden');

    document.getElementById('recurForm').onsubmit = (e) => {
      e.preventDefault();
      const client = document.getElementById('recurClientName').value;
      const discipline = document.getElementById('recurDiscipline').value;
      const staff = document.getElementById('recurStaff').value;
      const total = parseInt(document.getElementById('recurTotalSessions').value, 10);
      const start = new Date(document.getElementById('recurStartDate').value);

      for (let i = 0; i < total; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + (i * 7));
        state.appointments.push({
          id: 'rec-' + Date.now() + '-' + i,
          client: client,
          discipline: discipline,
          staff: staff,
          service: '連續服務',
          section: `Section ${i + 1}`,
          date: formatDate(d),
          startTime: '09:30',
          endTime: '10:30',
          status: 'active'
        });
      }
      saveLocal();
      syncFirebase();
      document.getElementById('recurModal').classList.add('hidden');
      renderCurrentView();
      showToast(`已批次建立 ${total} 節連續服務`);
    };

    // Firebase 即時同步與匿名認證
    let rtdb = null;
    let rtdbRef = null;

    async function initFirebase() {
      try {
        const app = initializeApp({
          apiKey: atob("QUl6YVN5QVlUd0lMd3VmaEdpMlNVYXpYbXhBRDJ0MDZ4d3k1NmVn"),
          authDomain: "mwcrehabilitationschedule.firebaseapp.com",
          databaseURL: "https://mwcrehabilitationschedule-default-rtdb.asia-southeast1.firebasedatabase.app"
        });

        const auth = getAuth(app);
        
        try {
          await signInAnonymously(auth);
        } catch (authErr) {
          console.warn('匿名認證失敗，請確認 Firebase Console 中 Authentication 是否已啟用 Anonymous 登入:', authErr);
        }

        rtdb = getDatabase(app);
        rtdbRef = ref(rtdb, 'mwc_calendar_hub');

        onValue(rtdbRef, (snapshot) => {
          const val = snapshot.val();
          if (val && Array.isArray(val) && val.length > 0) {
            state.appointments = val;
            saveLocal();
            renderCurrentView();
          } else if (!val) {
            set(rtdbRef, state.appointments);
          }
          setSyncStatus(true, "多方即時連線中");
        }, (err) => {
          console.warn('Firebase 讀取被拒或中斷，已啟動本機安全模式:', err);
          setSyncStatus(false, "本機安全模式 (權限/離線)");
        });

      } catch (err) {
        console.warn('Firebase 初始化失敗，使用離線本機模式:', err);
        setSyncStatus(false, "本機安全模式 (離線運作)");
      }
    }

    function syncFirebase() {
      if (rtdb && rtdbRef && state.isOnline) {
        set(rtdbRef, state.appointments).catch(e => {
          console.warn('雲端推送失敗，保留本機快取:', e);
          setSyncStatus(false, "本機安全模式 (同步失敗)");
        });
      }
    }

    // 啟動程序
    initData();
    updateDisciplineFilterUI();
    renderCurrentView();
    initFirebase();
  </script>
</body>
</html>
